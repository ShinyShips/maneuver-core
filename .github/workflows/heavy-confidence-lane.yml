name: Heavy confidence lane

on:
  pull_request:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

concurrency:
  group: heavy-confidence-lane-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  heavy-confidence-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run Heavy confidence lane
        run: npm run test:heavy

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: heavy-confidence-lane-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
